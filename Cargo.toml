[package]
name = "plus-migrate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4.45"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
indicatif = "0.18"
mysql_async = "0.37"
regex = "1.13.1"
roaring = "0.11.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
